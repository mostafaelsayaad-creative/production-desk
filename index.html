<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Agency X Production Desk: assign video jobs, track every delivery stage, review work and score team performance. Interactive demo."><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Agency X Production Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a quiet monochrome control room. Black wordmark, hairline rules, the "/" from the logo as the section mark, colour reserved for job status. */
:root{
  --bg:#F2F0EB; --surface:#FBFAF7; --sunk:#E9E6DF; --fg:#111216; --muted:#67645D; --faint:#A29E95;
  --line:#E1DDD5; --line-strong:#CEC9BE; --ink:#111216; --on-ink:#FBFAF7; --rec:#2E3CF0; --focus:#2E3CF0;
  --ns-bg:#EDEDEA; --ns-fg:#5B5B57; --ip-bg:#E3ECFD; --ip-fg:#1F4FB0; --ir-bg:#FBF0D6; --ir-fg:#87590A;
  --rv-bg:#EFE7FB; --rv-fg:#6232A8; --dn-bg:#E1F3E8; --dn-fg:#1C7444; --bl-bg:#FCE4E1; --bl-fg:#B3261E;
  --good:#1C7444; --warn:#B07A10; --bad:#C62A21;
  --shadow:0 1px 2px rgba(18,18,18,.05),0 8px 24px rgba(18,18,18,.06);
  --f-display:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0F12; --surface:#16171B; --sunk:#1D1E23; --fg:#F0EEE9; --muted:#A3A097; --faint:#6E6C66;
  --line:#2A2B30; --line-strong:#3A3B41; --ink:#F0EEE9; --on-ink:#111216; --rec:#8A93FF; --focus:#8A93FF;
  --ns-bg:#2A2A28; --ns-fg:#C3C3BD; --ip-bg:#1B2A47; --ip-fg:#9DBBFF; --ir-bg:#3A2E12; --ir-fg:#F1C66B;
  --rv-bg:#2D2242; --rv-fg:#C7A8FF; --dn-bg:#15301F; --dn-fg:#7FD9A2; --bl-bg:#3D1916; --bl-fg:#FF8C82;
  --good:#7FD9A2; --warn:#F1C66B; --bad:#FF8C82; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F12; --surface:#16171B; --sunk:#1D1E23; --fg:#F0EEE9; --muted:#A3A097; --faint:#6E6C66;
  --line:#2A2B30; --line-strong:#3A3B41; --ink:#F0EEE9; --on-ink:#111216; --rec:#8A93FF; --focus:#8A93FF;
  --ns-bg:#2A2A28; --ns-fg:#C3C3BD; --ip-bg:#1B2A47; --ip-fg:#9DBBFF; --ir-bg:#3A2E12; --ir-fg:#F1C66B;
  --rv-bg:#2D2242; --rv-fg:#C7A8FF; --dn-bg:#15301F; --dn-fg:#7FD9A2; --bl-bg:#3D1916; --bl-fg:#FF8C82;
  --good:#7FD9A2; --warn:#F1C66B; --bad:#FF8C82; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--f-display);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em;font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:22px;width:auto;display:block}
.brand .logo-w{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .logo-b{display:none}:root:not([data-theme="light"]) .brand .logo-w{display:block}}
:root[data-theme="dark"] .brand .logo-b{display:none} :root[data-theme="dark"] .brand .logo-w{display:block}
.brand .slash{color:var(--faint);font-weight:300;font-size:22px;line-height:1;transform:translateY(-1px)}
.brand .desk{font-weight:500;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.on i{background:var(--rec);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live.on i{animation:none}}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:10px 14px 12px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--ink)}

main{padding-block:28px 64px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.eyebrow b{color:var(--rec);font-weight:500}
h1{font-size:clamp(26px,3.6vw,36px);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:8px 0 0;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0;letter-spacing:.005em}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:30px;padding:0 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.notice{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--muted);margin-bottom:22px;background:var(--surface)}
.notice strong{color:var(--fg);font-weight:600}
.notice .btn{margin-left:auto}

/* stats strip */
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:22px}
.stat{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.stat .t{font-size:12px;color:var(--muted);margin-top:2px}
.stat.alert .v{color:var(--bad)}
@media (max-width:900px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(4){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:480px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{border-left:0!important;border-top:1px solid var(--line)}.stat:nth-child(odd){border-right:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-head .hint{font-size:12px;color:var(--muted)}
.stack{display:grid;gap:22px;min-width:0}

/* status chip */
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:0}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ns{background:var(--ns-bg);color:var(--ns-fg)} .s-ip{background:var(--ip-bg);color:var(--ip-fg)} .s-ir{background:var(--ir-bg);color:var(--ir-fg)}
.s-rv{background:var(--rv-bg);color:var(--rv-fg)} .s-dn{background:var(--dn-bg);color:var(--dn-fg)} .s-bl{background:var(--bl-bg);color:var(--bl-fg)}
.prio{font:500 11px/1 var(--f-mono);letter-spacing:.04em;padding:4px 6px;border-radius:4px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.prio.p1{border-color:transparent;background:var(--ink);color:var(--on-ink)}
.code{font:500 12px/1 var(--f-mono);padding:4px 6px;border-radius:4px;background:var(--sunk);white-space:nowrap;display:inline-block}

/* status bar */
.sbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.sbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* attention list */
.alist{list-style:none;margin:0;padding:0;display:grid}
.alist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.alist li:first-child{border-top:0;padding-top:2px}
.flag{font:500 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:4px;white-space:nowrap}
.flag.bad{background:var(--bl-bg);color:var(--bl-fg)} .flag.warn{background:var(--ir-bg);color:var(--ir-fg)} .flag.info{background:var(--sunk);color:var(--muted)}
.alist .what{min-width:0}
.alist .what div{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alist .what small{color:var(--muted);font-size:12px}
.empty-line{color:var(--muted);font-size:13px;padding:8px 0}

/* load bars */
.loads{display:grid;gap:12px}
.load{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 52px;gap:12px;align-items:center}
.load .who{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load .who small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.track{position:relative;height:10px;background:var(--sunk);border-radius:999px}
.track .band{position:absolute;top:-3px;bottom:-3px;left:70%;width:15%;border-left:1px dashed var(--line-strong);border-right:1px dashed var(--line-strong)}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ink)}
.track .fill.over{background:var(--bad)}
.load .pct{text-align:right;font:500 12.5px var(--f-mono)}
.load .pct.over{color:var(--bad)}

/* toolbar + filters */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;height:36px;padding:0 12px 0 34px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
select.f{height:36px;padding:0 30px 0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{height:30px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.count{font-size:12.5px;color:var(--muted);margin-left:auto}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:980px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;background:var(--surface);position:sticky;top:0}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:focus-visible{outline:2px solid var(--focus)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td .task{font-weight:500}
td .meta{color:var(--muted);font-size:12px}
.days{font:500 12.5px var(--f-mono);white-space:nowrap}
.days.late{color:var(--bad)} .days.soon{color:var(--warn)}
.inline-status{appearance:none;border:0;padding:0 22px 0 9px;height:24px;border-radius:999px;font-weight:600;font-size:12px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 11px) 55%,calc(100% - 7px) 55%;background-size:4px 4px;background-repeat:no-repeat}

/* kanban */
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px;transition:outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.col.drop{outline-color:var(--line-strong)}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px}
.col-head .n{font:500 12px var(--f-mono);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;display:grid;gap:8px;cursor:grab;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.card:hover{border-color:var(--line-strong)}
.card.dragging{opacity:.4}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .t{font-weight:500;line-height:1.3}
.card .m{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}

/* schedule */
.sched{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sgrid{display:grid;min-width:920px;position:relative}
.sgrid .cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:44px}
.sgrid .rowhead{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:500;position:sticky;left:0;background:var(--surface);z-index:2}
.sgrid .rowhead small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.sgrid .dayh{padding:10px 6px 8px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;font:500 11px/1.3 var(--f-mono);color:var(--muted)}
.sgrid .dayh b{display:block;color:var(--fg);font:600 15px/1.2 var(--f-display)}
.sgrid .dayh.today b{color:var(--rec)}
.sgrid .wknd{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
.lane{position:relative;border-bottom:1px solid var(--line)}
.bar{position:absolute;height:26px;border-radius:6px;padding:0 8px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap;cursor:pointer;border:1px solid transparent}
.bar.late{border-color:var(--bad)}
.todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--rec);opacity:.7;pointer-events:none;z-index:1}

/* team */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.person-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:600;flex:none}
.person-name{display:flex;gap:12px;align-items:center;min-width:0}
.person-name div{min-width:0}
.person-name strong{display:block;font-size:15px}
.person-name small{color:var(--muted)}
.skills{display:grid;gap:7px}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px}
.pips{display:flex;gap:4px}
.pip{width:22px;height:8px;border-radius:2px;background:var(--sunk);border:0;padding:0}
.pip.on{background:var(--ink)}
button.pip{cursor:pointer}
button.pip:hover{outline:1px solid var(--line-strong)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.minijobs{display:grid;gap:6px;font-size:13px}
.minijobs div{display:flex;gap:8px;align-items:center;min-width:0}
.minijobs span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* scores */
.score{display:inline-flex;gap:3px;vertical-align:middle}
.score i{width:8px;height:8px;border-radius:50%;background:var(--sunk)}
.score i.on{background:var(--ink)}
.avg{font:600 15px var(--f-display);font-variant-numeric:tabular-nums}
.avg.good{color:var(--good)} .avg.bad{color:var(--bad)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.d-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.d-body{flex:1;overflow-y:auto;padding:20px 22px;display:grid;gap:14px;align-content:start}
.d-foot{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.d-foot .spacer{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
label.fl{display:grid;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
label.fl input,label.fl select,label.fl textarea{height:38px;padding:0 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14px;font-weight:400;width:100%;min-width:0}
label.fl textarea{height:auto;min-height:72px;padding:9px 11px;resize:vertical}
.fsec{font:500 10.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-top:6px;grid-column:1/-1;display:flex;gap:8px}
.fsec::before{content:"/";color:var(--rec)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:999px;font-weight:500;opacity:0;transition:all .2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}

/* empty / loading */
.emptystate{border:1px dashed var(--line-strong);border-radius:var(--r);padding:40px 24px;text-align:center;color:var(--muted);background:var(--surface)}
.emptystate h2{color:var(--fg);font-size:18px;margin-bottom:6px}
.skel{height:14px;border-radius:6px;background:var(--sunk);margin:10px 0}
footer.foot{border-top:1px solid var(--line);padding-block:18px;color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
.hide-sm{} @media (max-width:640px){.hide-sm{display:none}}

/* v2 additions: roles, task flow, comments, scoring */
:root{--as-bg:#F1ECE3;--as-fg:#7A5A28;--ac-bg:#DDF1EF;--ac-fg:#0F6B66}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--as-bg:#2E2619;--as-fg:#E2C38F;--ac-bg:#12302E;--ac-fg:#7FD6CF}}
:root[data-theme="dark"]{--as-bg:#2E2619;--as-fg:#E2C38F;--ac-bg:#12302E;--ac-fg:#7FD6CF}
.s-as{background:var(--as-bg);color:var(--as-fg)} .s-ac{background:var(--ac-bg);color:var(--ac-fg)}
.actor{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0}
.actor select{height:32px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);padding:0 28px 0 10px;max-width:220px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.actor .lbl{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.me-pill{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;min-width:0}
.me-pill img,.me-pill .avatar{width:26px;height:26px;border-radius:50%;font-size:11px}
.me-pill span{overflow:hidden;text-overflow:ellipsis}
.role-tag{font:500 10px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.role-tag.admin{background:var(--ink);color:var(--on-ink)}
.top-row .live{margin-left:0}
@media (max-width:640px){.actor .lbl{display:none}.top-row{flex-wrap:wrap}.actor{margin-left:0;order:3;width:100%}.actor select{max-width:none;flex:1}}
.preview-band{background:var(--ink);color:var(--on-ink)}
.preview-band .wrap{display:flex;gap:12px;align-items:center;padding-block:8px;font-size:13px;flex-wrap:wrap}
.preview-band button{margin-left:auto;background:transparent;color:inherit;border:1px solid currentColor;border-radius:999px;height:28px;padding:0 12px}
nav.tabs a .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--rec);color:#fff;font:600 11px/1 var(--f-display)}

/* my tasks */
.groups{display:grid;gap:26px}
.group h2{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.group h2 .n{font:500 12px var(--f-mono);color:var(--muted)}
.tasks{display:grid;gap:10px}
.task-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.task-card:hover{border-color:var(--line-strong)}
.task-card .l{min-width:0;display:grid;gap:6px}
.task-card .t{font-weight:600;font-size:15px}
.task-card .m{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
.task-card .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.progress{display:flex;gap:3px;align-items:center}
.progress i{width:18px;height:5px;border-radius:2px;background:var(--line-strong)}
.progress i.on{background:var(--ink)}
@media (max-width:560px){.task-card{grid-template-columns:minmax(0,1fr)}.task-card .r{justify-content:flex-start}}

/* task drawer */
.drawer.wide{width:min(640px,100%)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r)}
.facts div{min-width:0}
.facts small{display:block;font:500 10px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.facts span{font-weight:500;overflow-wrap:anywhere}
@media (max-width:480px){.facts{grid-template-columns:1fr 1fr}}
.brief{white-space:pre-wrap;color:var(--fg);font-size:14px;line-height:1.55;margin:0}
.flow{display:grid;gap:0;position:relative}
.step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.step::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .dotc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;z-index:1}
.step.done .dotc{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.step.late .dotc{border-color:var(--bad)}
.step .body{min-width:0;display:grid;gap:6px;padding-top:1px}
.step .row1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.step .row1 strong{font-weight:600}
.step .row1 .when{font:500 12px var(--f-mono);color:var(--muted)}
.tag{font:500 10.5px/1 var(--f-mono);padding:4px 6px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.tag.ok{background:var(--dn-bg);color:var(--dn-fg)} .tag.late{background:var(--bl-bg);color:var(--bl-fg)} .tag.int{background:var(--rv-bg);color:var(--rv-fg)} .tag.cli{background:var(--ir-bg);color:var(--ir-fg)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline-form input,.inline-form textarea{flex:1 1 200px;min-width:0;height:34px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg)}
.inline-form textarea{height:60px;padding:8px 10px;flex-basis:100%;resize:vertical}
a.linkout{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;overflow-wrap:anywhere;font-size:13px}
.hr{height:1px;background:var(--line);margin:4px 0}
.thread{display:grid;gap:12px}
.msg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.msg .avatar{width:30px;height:30px;font-size:11px}
.msg .who{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.msg .who small{font:400 11.5px var(--f-mono);color:var(--muted)}
.msg p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.sec-title{font:500 10.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.sec-title::before{content:"/";color:var(--rec)}
.stagepick{display:grid;gap:8px}
.stagepick label{display:grid;grid-template-columns:20px minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:14px}
.stagepick input[type=date]{height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 8px;min-width:0}
@media (max-width:420px){.stagepick label{grid-template-columns:20px minmax(0,1fr)}.stagepick input[type=date]{grid-column:2}}

/* performance */
.scorebar{display:flex;align-items:center;gap:10px}
.scorebar .track{flex:1;min-width:60px}
.scorebar b{font:600 18px var(--f-display);font-variant-numeric:tabular-nums;min-width:30px}
.grade{font:500 10.5px/1 var(--f-mono);letter-spacing:.05em;padding:4px 7px;border-radius:4px;white-space:nowrap}
.g-ex{background:var(--dn-bg);color:var(--dn-fg)} .g-st{background:var(--ip-bg);color:var(--ip-fg)} .g-ns{background:var(--ir-bg);color:var(--ir-fg)} .g-ar{background:var(--bl-bg);color:var(--bl-fg)} .g-na{background:var(--sunk);color:var(--muted)}
.comp{display:grid;gap:12px}
.comp-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:13px}
.comp-row .track{height:8px}
.comp-row .val{text-align:right;font:500 12.5px var(--f-mono)}
.comp-row small{display:block;color:var(--muted);font-size:11.5px}
@media (max-width:520px){.comp-row{grid-template-columns:minmax(0,1fr) 80px}.comp-row .track{grid-column:1/-1;grid-row:2}}
.weights{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;font-size:12.5px;color:var(--muted)}
.weights b{display:block;color:var(--fg);font-size:13px}
.profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.profile-head .avatar,.profile-head img.av{width:56px;height:56px;border-radius:50%;font-size:18px;flex:none}
.big-score{font:600 54px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.link-row{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);width:100%;text-align:left}
.link-row:hover{border-color:var(--fg)}
.link-row img{width:28px;height:28px;border-radius:50%}
.claims{display:grid;gap:8px;margin-bottom:22px}
.callout{padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:12px;margin-bottom:22px}
.callout h2{font-size:16px}


.axlogo{display:inline-flex;align-items:center;gap:3px;color:var(--fg);line-height:1}
.axword{font:800 21px/1 var(--f-display);letter-spacing:-.035em}
.axmark{width:18px;height:18px;display:block;margin-top:2px}
.brand .logo-b,.brand .logo-w{display:none!important}

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { if(!s) return null; const [y,m,d] = String(s).slice(0,10).split("-").map(Number); return y ? new Date(y,m-1,d) : null; };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const isoDay = iso => iso ? ymd(new Date(iso)) : null;
const ago = iso => { if(!iso) return ""; const m = Math.round((Date.now()-new Date(iso))/6e4); if (m<1) return "just now"; if (m<60) return `${m} min ago`; const h = Math.round(m/60); if (h<24) return `${h}h ago`; const d = Math.round(h/24); return d<8 ? `${d}d ago` : fmt(isoDay(iso)); };

/* ================= model ================= */
const tById = id => S.team.find(t=>t.id===id);

const workOf = j => { const t = tById(j.assignee); return (t && S.work[keyOf(t)]?.[j.id]) || {}; };
function status(j){
  if (j.approvedAt) return "Done";
  if (!j.assignee) return "Unassigned";
  const w = workOf(j); if (w.blocked) return "Blocked";
  const ls = last(w.submissions)?.at, lr = last(j.reviews)?.at;
  if (ls && (!lr || ls > lr)) return "In review";
  if (lr) return "Revisions";
  if (w.startedAt || Object.values(w.stages||{}).some(s=>s?.doneAt)) return "In progress";
  if (w.acceptedAt) return "Accepted";
  return "Assigned";
}

function memberLoad(t){ const js = S.jobs.filter(j=>j.assignee===t.id && OPEN(status(j))); return {jobs:js, hours:js.reduce((a,j)=>a+(num(j.estHours)||0),0)}; }

/* ================= performance ================= */
function perf(t, days){
  const since = days ? Date.now() - days*864e5 : 0;
  const mine = S.jobs.filter(j=>j.assignee===t.id);
  const done = mine.filter(j=>j.approvedAt && +new Date(j.approvedAt) >= since);
  const C = {};
  // on time: last submission before approval vs deadline
  const ot = done.filter(j=>j.deadline).map(j=>{ const subs = workOf(j).submissions||[]; const final = last(subs)?.at || j.approvedAt; return isoDay(final) <= j.deadline; });
  if (ot.length) C.onTime = {v: ot.filter(Boolean).length/ot.length*100, label:`${ot.filter(Boolean).length} of ${ot.length} jobs`};
  // stages
  let sn=0, sd=0; const td = ymd(today());
  mine.forEach(j=>{ const w = workOf(j); stagesOf(j).forEach(s=>{ if(!s.due) return; const dueMs = +parse(s.due); if (dueMs < since) return;
    const dn = w.stages?.[s.k]?.doneAt; if (dn) { sd++; if (isoDay(dn) <= s.due) sn++; } else if (s.due < td && OPEN(status(j))) { sd++; } }); });
  if (sd) C.stages = {v: sn/sd*100, label:`${sn} of ${sd} stages`};
  if (done.length){
    const ir = done.reduce((a,j)=>a+(j.reviews||[]).filter(r=>r.type==="internal").length,0)/done.length;
    const cr = done.reduce((a,j)=>a+(j.reviews||[]).filter(r=>r.type==="client").length,0)/done.length;
    C.internal = {v: Math.max(0,100-25*ir), label:`${ir.toFixed(1)} per job`, raw:ir};
    C.client = {v: Math.max(0,100-30*cr), label:`${cr.toFixed(1)} per job`, raw:cr};
  }
  const acc = mine.filter(j=>j.assignedAt && +new Date(j.assignedAt) >= since).map(j=>{ const w = workOf(j); const end = w.acceptedAt ? +new Date(w.acceptedAt) : (j.approvedAt?null:Date.now()); return end==null?null:Math.max(0,(end-new Date(j.assignedAt))/36e5); }).filter(x=>x!=null);
  if (acc.length){ const h = acc.reduce((a,b)=>a+b,0)/acc.length; C.accept = {v: h<=4?100:h>=48?0:100-(h-4)/44*100, label: h<1?`${Math.round(h*60)} min avg`:`${h.toFixed(1)}h avg`, raw:h}; }
  const eff = done.map(j=>({e:num(j.estHours), a:num(workOf(j).actualHours)})).filter(x=>x.e&&x.a);
  if (eff.length){ const e = eff.reduce((a,x)=>a+x.e,0), a = eff.reduce((s,x)=>s+x.a,0); C.efficiency = {v: Math.min(100,e/a*100), label:`${a}h used of ${e}h`}; }
  let tw=0, ts=0; W.forEach(([k,,w])=>{ if (C[k]) { tw+=w; ts+=C[k].v*w; } });
  const score = tw ? Math.round(ts/tw) : null;
  return {score, grade:grade(score), C, done:done.length, active:mine.filter(j=>OPEN(status(j))).length};
}
function grade(s){ if (s==null) return {c:"g-na",l:"Not enough data"}; if (s>=85) return {c:"g-ex",l:"Excellent"}; if (s>=70) return {c:"g-st",l:"Strong"}; if (s>=55) return {c:"g-ns",l:"Needs support"}; return {c:"g-ar",l:"At risk"}; }

/* ================= small renderers ================= */
const chip = s => `<span class="chip ${SC[s]?.c||"s-ns"}">${esc(s)}</span>`;
const prio = p => p ? `<span class="prio ${p.startsWith("P1")?"p1":""}">${esc(p.split(" ")[0])}</span>` : "";
const roleTag = t => t ? `<span class="role-tag ${isAdminRole(t)?"admin":""}">${esc(t.role||"Member")}</span>` : "";
function avatar(t, cls="avatar"){ const p = t?.uid && S.profiles[t.uid]; if (p?.avatarUrl && p.name) return `<img class="${cls==="avatar"?"av":cls}" src="${esc(p.avatarUrl)}" alt="" style="border-radius:50%">`; return `<span class="avatar">${esc(initials(t?.name))}</span>`; }
function daysCell(j){ const d = daysLeft(j); if (d==null) return `<span class="days">–</span>`; const c = d<0?"late":d<=2?"soon":""; return `<span class="days ${c}">${d<0?`${-d}d late`:d===0?"Today":`${d}d`}</span>`; }
function progress(j){ const st = stagesOf(j); if(!st.length) return ""; const w = workOf(j); return `<span class="progress" aria-label="${stagesDone(j)} of ${st.length} stages done">${st.map(s=>`<i class="${w.stages?.[s.k]?.doneAt?"on":""}"></i>`).join("")}</span>`; }
function head(n,label,title,sub,actions=""){ return `<div class="view-head"><div><div class="eyebrow"><b>${n}</b><span>/</span><span>${label}</span></div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:""}</div><div class="actions">${actions}</div></div>`; }
function scoreBar(p){ const s = p.score; return `<div class="scorebar"><b>${s??"–"}</b><div class="track"><div class="fill" style="width:${s??0}%;background:${s==null?"var(--line)":s>=70?"var(--ink)":s>=55?"var(--warn)":"var(--bad)"}"></div></div><span class="grade ${p.grade.c}">${p.grade.l}</span></div>`; }
function sampleNotice(){
  if (![...S.jobs,...S.team].some(x=>x.sample)) return "";

}
function guard(coll, html){
  if (S.offline) return `<div class="emptystate"><h2>The shared tracker isn't connected in this view</h2><p>Open this page in Claude while signed in to load the live production data.</p></div>`;
  if (!S.loaded[coll]) return `<div class="panel">${'<div class="skel"></div>'.repeat(5)}</div>`;

}

  </div><div class="stack">

      <div class="sbar" role="img" aria-label="${counts.map(c=>`${c.k} ${c.n}`).join(", ")}">${counts.filter(c=>c.n).map(c=>`<span style="width:${c.n/total*100}%;background:var(${c.v})"></span>`).join("")}</div>

function filteredJobs(){
  const f = S.f, q = f.q.trim().toLowerCase();
  const js = S.jobs.map(j=>({...j,_s:status(j),_m:tById(j.assignee)?.name||""})).filter(j =>
    (f.status==="all" || (f.status==="open" ? OPEN(j._s) : j._s===f.status)) && (f.member==="all" || j.assignee===f.member) && (f.prio==="all" || j.priority===f.prio) &&
    (!q || [j.jobId,j.task,j.client,j._m,j.equipment,j.vendor,j.brief,j.format].join(" ").toLowerCase().includes(q)));
  const k = S.sort.k, d = S.sort.d;
  const val = j => k==="days" ? (daysLeft(j)??1e9) : k==="status" ? STATUSES.findIndex(s=>s.k===j._s) : k==="priority" ? PRIOS.indexOf(j.priority) : k==="member" ? j._m.toLowerCase() : String(j[k]??"").toLowerCase()||"~";
  return js.sort((a,b)=>{ const x=val(a), y=val(b); return (x>y?1:x<y?-1:0)*d; });
}

function renderSchedule(){
  const t = today(), start = addDays(t,-((t.getDay()+6)%7)), N = 14, days = Array.from({length:N},(_,i)=>addDays(start,i));
  const people = S.team.filter(m=>S.jobs.some(j=>j.assignee===m.id) || !isAdminRole(m));
  const rowsFor = id => { const js = S.jobs.filter(j=>j.assignee===id && (j.deadline||j.start)).map(j=>{ const a = diff(parse(j.start||j.deadline),start), b = diff(parse(j.deadline||j.start),start); return {j,a:Math.max(0,a),b:Math.min(N-1,b)}; }).filter(x=>x.b>=0&&x.a<=N-1&&x.a<=x.b);
    const rows=[]; js.sort((x,y)=>x.a-y.a).forEach(x=>{ let r = rows.findIndex(e=>e<x.a); if(r<0){r=rows.length;rows.push(-1);} rows[r]=x.b; x.r=r; }); return {js,h:Math.max(1,rows.length)*32+12}; };
  const lane = (label, sub, id) => { const {js,h} = rowsFor(id);
    return `<div class="rowhead" style="height:${h}px">${esc(label)}<small>${esc(sub)}</small></div><div class="lane" style="grid-column:2/-1;height:${h}px">
      ${days.map((d,i)=>`<div style="position:absolute;top:0;bottom:0;left:${i/N*100}%;width:${100/N}%;border-left:1px solid var(--line)" class="${d.getDay()%6===0?"wknd":""}"></div>`).join("")}
      ${js.map(x=>{ const s = status(x.j), late = (daysLeft(x.j)??0)<0; return `<div class="bar ${SC[s].c} ${late?"late":""}" data-act="openJob" data-id="${x.j.id}" title="${esc(x.j.task)} · ${esc(s)}" style="left:calc(${x.a/N*100}% + 3px);width:calc(${(x.b-x.a+1)/N*100}% - 6px);top:${8+x.r*32}px"><span class="mono" style="font-weight:500">${esc(x.j.jobId)}</span><span>${esc(x.j.task)}</span></div>`; }).join("")}</div>`; };
  return head("03","Schedule","Two weeks, person by person","Each bar runs from a job's start date to its deadline. A red outline means the deadline has passed.")
  + guard("jobs", `<div class="sched"><div class="sgrid" style="grid-template-columns:minmax(150px,180px) repeat(${N},minmax(52px,1fr))">

async function resolveNames(){
  if (!S.user) return; const ids = [...new Set([...S.team.map(t=>t.uid), ...S.claims.map(c=>c.id)].filter(Boolean))]; if (!ids.length) return;
  try { const ps = await S.user.profiles(ids); let changed = false; ids.forEach(id=>{ if (ps[id] && S.profiles[id]?.avatarUrl !== ps[id].avatarUrl) { S.profiles[id] = ps[id]; changed = true; } });
    document.querySelectorAll("[data-pname]").forEach(el=>{ el.textContent = ps[el.dataset.pname]?.name || "Someone"; });
    if (changed) { renderChrome(); } } catch(_){}
}

/* ================= writes ================= */
async function put(path, data, mode="set"){
  if (!S.db) { toast("Not connected. Changes can't be saved in this view."); return false; }
  try { const ref = S.db.doc(path); if (mode==="set") await ref.set(data); else if (mode==="update") await ref.update(data); else await ref.delete(); return true; }
  catch (e) { if (e?.code==="invalid_argument") toast("You don't have permission for that. Admins assign jobs; team members update their own tasks.");
    else if (e?.code==="quota_exceeded") toast("The tracker is full. Delete old records, then try again."); else toast("Couldn't save. Check your connection and try again."); return false; }
}
const newId = coll => S.db.collection(coll).doc().id;
async function saveWork(j, patch){ const t = tById(j.assignee); if (!t) return false; const cur = workOf(j);
  return put(`work/${keyOf(t)}/jobs/${j.id}`, {...JSON.parse(JSON.stringify(cur)), ...patch, updatedAt:nowIso()}); }
async function linkProfile(t, uid){
  const oldKey = "p-"+t.id;
  if (!(await put(`team/${t.id}`, {uid}, "update"))) return false;
  for (const [jid,w] of Object.entries(S.work[oldKey]||{})) { await put(`work/${uid}/jobs/${jid}`, w); await put(`work/${oldKey}/jobs/${jid}`, null, "delete"); }
  for (const c of (S.comments[oldKey]||[])) { const {id, ...rest} = c; await put(`work/${uid}/comments/${id}`, rest); await put(`work/${oldKey}/comments/${id}`, null, "delete"); }
  return true;
}

function drawTask(D){
  const j = S.jobs.find(x=>x.id===D.id); if (!j) return {eyebrow:"",title:"This job was removed",body:"",foot:`<span class="spacer"></span><button type="button" class="btn" data-act="close">Close</button>`};
  const s = status(j), w = workOf(j), t = tById(j.assignee), act = canActOn(j), adm = adminMode(), open = OPEN(s);
  const step = (cls, title, when, inner="") => `<div class="step ${cls}"><span class="dotc">${cls.includes("done")?CHECK:""}</span><div class="body"><div class="row1"><strong>${title}</strong>${when?`<span class="when">${when}</span>`:""}</div>${inner}</div></div>`;
  const stageSteps = stagesOf(j).map(st=>{ const d = w.stages?.[st.k], late = st.due && (d?.doneAt ? isoDay(d.doneAt) > st.due : st.due < ymd(today()));
    let inner = "";
    if (d?.doneAt) inner = `<div class="inline-form">${d.link?`<a class="linkout" href="${esc(d.link)}" target="_blank" rel="noopener">${esc(d.link)}</a>`:`<span class="meta" style="color:var(--muted);font-size:13px">No link added</span>`}${act&&open?`<button type="button" class="btn sm ghost" data-act="undoStage" data-k="${st.k}">Undo</button>`:""}</div>`;
    else if (act && open && w.acceptedAt) inner = `<div class="inline-form"><input id="lk_${st.k}" type="url" placeholder="Link to this stage (Frame.io, Drive…)" aria-label="Link for ${STAGE_L[st.k]}"><button type="button" class="btn sm primary" data-act="stageDone" data-k="${st.k}">Mark complete</button></div>`;
    return step(`${d?.doneAt?"done":""} ${late?"late":""}`, STAGE_L[st.k], `${st.due?`due ${fmt(st.due)}`:""}${d?.doneAt?` · done ${fmt(isoDay(d.doneAt))}`:""}${late?` <span class="tag late">Late</span>`:d?.doneAt&&st.due?` <span class="tag ok">On time</span>`:""}`, inner); }).join("");
  const events = [...(w.submissions||[]).map(x=>({...x,kind:"sub"})), ...(j.reviews||[]).map(x=>({...x,kind:x.type}))].sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  const evSteps = events.map(e=> e.kind==="sub"
    ? step("done","Submitted for review",ago(e.at), `${e.link?`<a class="linkout" href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.link)}</a>`:""}${e.note?`<p class="brief" style="font-size:13px;color:var(--muted)">${esc(e.note)}</p>`:""}`)

const V = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };

async function submitForm(){
  const D = S.drawer, now = nowIso(), a = me();
  if (D.kind==="job") {
    if (!V("task")) return toast("Add a task name so the assignee knows what the job is.");
    if (V("start") && V("deadline") && V("deadline") < V("start")) return toast("The deadline is before the start date.");
    const prev = S.jobs.find(x=>x.id===D.id) || {};
    const stages = STAGES.filter(([k])=>document.getElementById("st_"+k)?.checked).map(([k])=>({k, due:V("sd_"+k)}));
    const assignee = V("assignee");
    const o = {...JSON.parse(JSON.stringify(prev)), jobId:V("jobId")||nextJobId(), priority:V("priority"), task:V("task"), client:V("client"), format:V("format"), brief:V("brief"), briefLink:V("briefLink"),
      assignee, start:V("start"), deadline:V("deadline"), estHours:num(V("estHours")), vendor:V("vendor"), equipment:V("equipment").toUpperCase(), stages, updatedAt:now};
    delete o.id;
    if (assignee && assignee !== prev.assignee) { o.assignedAt = now; o.assignedBy = a?.id || null; o.reviews = prev.assignee ? [] : (prev.reviews||[]); }
    if (!assignee) { o.assignedAt = null; }
    if (!prev.createdAt) o.createdAt = now;
    if (await put(`jobs/${D.id||newId("jobs")}`, o)) { toast(D.id?"Saved":"Job assigned"); closeDrawer(); }
  } else if (D.kind==="member") {
    if (!V("name")) return toast("Add the person's name.");
    const prev = S.team.find(x=>x.id===D.id) || {};
    const o = {...JSON.parse(JSON.stringify(prev)), name:V("name"), role:V("role"), craft:V("craft"), capacity:num(V("capacity")), review:V("review"), training:V("training"), skills:Object.fromEntries(SKILLS.map(([k])=>[k,num(V("sk_"+k))||0])), updatedAt:now};
    delete o.id;
    if (await put(`team/${D.id||newId("team")}`, o)) { toast(D.id?"Saved":"Added"); closeDrawer(); }
  } else if (D.kind==="eq") {
    if (!V("code")) return toast("Add a code, for example CAM-FX3-03.");
    const prev = S.equipment.find(x=>x.id===D.id) || {};
    const o = {...JSON.parse(JSON.stringify(prev)), code:V("code").toUpperCase(), category:V("category"), item:V("item"), serial:V("serial"), status:V("status"), holder:V("holder"), jobId:V("eqJob"), checkout:V("checkout"), lastService:V("lastService"), notes:V("notes"), updatedAt:now};
    delete o.id;
    if (o.holder && o.status==="Available") { o.status = "Checked out"; if (!o.checkout) o.checkout = ymd(today()); }
    if (o.status!=="Checked out") { o.holder=""; o.jobId=""; o.checkout=""; }
    if (await put(`equipment/${D.id||newId("equipment")}`, o)) { toast("Saved"); closeDrawer(); }
  } else if (D.kind==="vendor") {
    if (!V("name")) return toast("Add the vendor's name.");
    const prev = S.vendors.find(x=>x.id===D.id) || {};
    const o = {...JSON.parse(JSON.stringify(prev)), name:V("name"), category:V("category"), contact:V("contact"), phone:V("phone"), scores:Object.fromEntries(V_CRIT.map(([k])=>[k,num(V("sc_"+k))||0])), jobs:num(V("jobs")), lastJob:V("lastJob"), notes:V("notes"), updatedAt:now};
    delete o.id;
    if (await put(`vendors/${D.id||newId("vendors")}`, o)) { toast("Saved"); closeDrawer(); }
  }
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, D = S.drawer, j = D?.kind==="task" ? S.jobs.find(x=>x.id===D.id) : null;
  if (el.closest(".task-card") && el !== el.closest(".task-card")) e.stopPropagation();
  switch (a) {
    case "close": closeDrawer(); break;
    case "endPreview": S.previewId = null; render(); break;
    case "openJob": openDrawer("task", {id}); break;
    case "goPerson": location.hash = "person-"+id; break;
    case "newJob": openDrawer("job", null, el.dataset.for); break;
    case "editJob": openDrawer("job", {id}); break;
    case "newMember": openDrawer("member", null); break;
    case "editMember": openDrawer("member", {id}); break;
    case "linkPerson": openDrawer("link", {id}); setTimeout(()=>{ const i = $("#pSearch"); i && (i.focus(), peopleSearch("")); }, 50); break;
    case "newEq": openDrawer("eq", null); break;
    case "openEq": openDrawer("eq", {id}); break;
    case "newVendor": openDrawer("vendor", null); break;
    case "openVendor": openDrawer("vendor", {id}); break;
    case "sort": { const k = el.dataset.k; S.sort = {k, d:S.sort.k===k?-S.sort.d:1}; render(); break; }
    case "mode": S.jobsMode = el.dataset.m; try{ localStorage.setItem("bp-mode",S.jobsMode); }catch(_){} render(); break;
    case "askDelete": D.confirm = true; drawDrawer(); break;
    case "cancelDelete": D.confirm = false; drawDrawer(); break;
    case "reallyDelete": { const coll = {job:"jobs",member:"team",eq:"equipment",vendor:"vendors"}[D.kind]; if (await put(`${coll}/${D.id}`, null, "delete")) { toast("Deleted"); closeDrawer(); } break; }
    /* member actions */
    case "accept": { const job = j || S.jobs.find(x=>x.id===id); if (job && await saveWork(job, {acceptedAt:nowIso()})) toast("Task accepted"); break; }
    case "stageDone": { const k = el.dataset.k, link = V("lk_"+k), w = workOf(j); if (link && !/^https?:\/\//i.test(link)) return toast("Links start with http:// or https://");
      if (await saveWork(j, {startedAt:w.startedAt||nowIso(), stages:{...(w.stages||{}), [k]:{doneAt:nowIso(), link}}})) toast(`${STAGE_L[k]} marked complete`); break; }
    case "undoStage": { const k = el.dataset.k, w = workOf(j), st = {...(w.stages||{})}; delete st[k]; if (await saveWork(j, {stages:st})) toast("Stage reopened"); break; }
    case "submit": { const link = V("subLink"); if (!link) return toast("Add the link to the finished file before submitting."); if (!/^https?:\/\//i.test(link)) return toast("Links start with http:// or https://");
      const w = workOf(j); if (await saveWork(j, {startedAt:w.startedAt||nowIso(), submissions:[...(w.submissions||[]), {at:nowIso(), link, note:V("subNote")}], blocked:false})) toast("Submitted for review"); break; }
    case "block": { const n = V("blockNote"); if (!n) return toast("Say what is blocking you, so the admins can help."); if (await saveWork(j, {blocked:true, blockedNote:n})) toast("Flagged as blocked"); break; }
    case "unblock": if (await saveWork(j, {blocked:false, blockedNote:""})) toast("Block cleared"); break;
    case "hours": { const h = num(V("hours")); if (h==null) return toast("Enter hours as a number."); if (await saveWork(j, {actualHours:h})) toast("Hours saved"); break; }
    case "comment": { const txt = V("cText"), au = actor(); if (!txt) return; if (!au) return toast("Link your profile to comment.");
      const key = keyOf(au); if (await put(`work/${key}/comments/${S.db.collection(`work/${key}/comments`).doc().id}`, {jobId:j.id, text:txt, at:nowIso(), author:au.id})) { $("#cText").value = ""; toast("Comment posted"); } break; }
    /* admin actions */
    case "review": { const type = el.dataset.type, note = V("revNote"); if (!note) return toast("Add a note so the assignee knows what to change.");

    case "skill": { const m = tById(id); const v = +el.dataset.v, cur = num(m?.skills?.[el.dataset.k])||0; await put(`team/${id}`, {skills:{[el.dataset.k]: cur===v?v-1:v}}, "update"); break; }
    case "checkIn": if (await put(`equipment/${id}`, {status:"Available", holder:"", jobId:"", checkout:"", updatedAt:nowIso()}, "update")) toast("Checked in"); break;
    case "serviced": { const x = S.equipment.find(q=>q.id===id); if (await put(`equipment/${id}`, {lastService:ymd(today()), status:x?.status==="In service"?"Available":x?.status, updatedAt:nowIso()}, "update")) toast("Service logged for today"); break; }
    /* linking */
    case "linkSelf": { const t = tById(V("selfLink")); if (t && await linkProfile(t, S.uid)) toast(`Linked you to ${t.name}`); break; }

    case "clearSamples": { const n = $(".notice"); n.innerHTML = `<span><strong>Remove all sample records?</strong> This clears the example people, jobs, progress, kit and vendors for everyone.</span><span style="margin-left:auto;display:flex;gap:8px"><button class="btn sm danger" type="button" data-act="reallyClear">Remove samples</button><button class="btn sm" type="button" data-act="cancelClear">Keep them</button></span>`; break; }
    case "cancelClear": render(); break;
    case "reallyClear": { let n = 0; for (const c of ["jobs","equipment","vendors"]) for (const r of S[c].filter(x=>x.sample)) { if (await put(`${c}/${r.id}`, null, "delete")) n++; }

  if (t.id==="period") { S.period = +t.value; render(); }
  if (t.id==="viewAs") { S.previewId = t.value || null; render(); if (S.previewId) location.hash = "my"; }
  if (t.id && t.id.startsWith("sd_") && t.value) { const cb = document.getElementById("st_"+t.id.slice(3)); if (cb) cb.checked = true; }
});
let qT; document.addEventListener("input", e => {
  if (e.target.id==="q"||e.target.id==="eq") { clearTimeout(qT); const v = e.target.value, id = e.target.id; qT = setTimeout(()=>{ if (id==="q") S.f.q = v; else S.eqf.q = v; render(); },160); }
  if (e.target.id==="pSearch") peopleSearch(e.target.value);
});
document.addEventListener("focusin", e => { if (e.target.id==="pSearch" && !e.target.value) peopleSearch(""); });
async function peopleSearch(q){
  const box = $("#pResults"); if (!box) return;
  if (!S.user) { box.innerHTML = `<p class="empty-line">People search isn't available in this view.</p>`; return; }
  const hits = await S.user.search(q);
  if ($("#pSearch")?.value !== q && q !== "") return;
  box.innerHTML = ""; if (!hits.length) { box.innerHTML = `<p class="empty-line">${q?"No one matches. Try another spelling.":"Start typing a name."}</p>`; return; }
  hits.forEach(h => { const b = document.createElement("button"); b.type = "button"; b.className = "link-row"; b.dataset.act = "pick"; b.dataset.id = h.id;
    const img = document.createElement("img"); img.src = h.avatarUrl; img.alt = ""; const sp = document.createElement("span"); sp.textContent = h.name + (h.isMe ? " (you)" : "") + (S.team.some(t=>t.uid===h.id) ? " · already linked" : "");
    b.append(img, sp); box.append(b); });
}
document.addEventListener("keydown", e => {
  if (e.key==="Escape" && S.drawer) closeDrawer();
  if ((e.key==="Enter"||e.key===" ") && e.target.matches("tr[data-act],article[data-act]")) { e.preventDefault(); e.target.click(); }
});
$("#scrim").addEventListener("click", closeDrawer);

async function exportCsv(){
  const cols = [["jobId","Job ID"],["priority","Priority"],["_s","Status"],["_m","Assigned to"],["task","Task"],["client","Client"],["format","Deliverable"],["start","Start"],["deadline","Deadline"],["estHours","Est. hours"],["equipment","Equipment"],["vendor","Vendor"],["revs","Revisions"]];
  const rows = [cols.map(c=>c[1]).join(","), ...filteredJobs().map(j=>({...j, revs:(j.reviews||[]).length})).map(j=>cols.map(([k])=>`"${String(j[k]??"").replace(/"/g,'""')}"`).join(","))].join("\n");
  if (!S.dl) return toast("Export isn't available in this view.");
  try { await S.dl.save({filename:`agency-x-production-jobs-${ymd(today())}.csv`, data:new Blob([rows],{type:"text/csv"})}); } catch(err) { if (err?.code!=="declined") toast("Couldn't export the file."); }
}

/* ================= data ================= */
function syncSubs(){
  const keys = new Set(S.team.map(keyOf));
  for (const k of Object.keys(S.subs)) if (!keys.has(k)) { S.subs[k].forEach(u=>u()); delete S.subs[k]; delete S.work[k]; delete S.comments[k]; }
  for (const k of keys) if (!S.subs[k]) {
    S.work[k] = S.work[k] || {}; S.comments[k] = S.comments[k] || [];
    S.subs[k] = [
      S.db.collection(`work/${k}/jobs`).onSnapshot(s=>{ S.work[k] = Object.fromEntries(s.docs.map(d=>[d.id,d.data()])); refresh(); }, ()=>{}),
      S.db.collection(`work/${k}/comments`).onSnapshot(s=>{ S.comments[k] = s.docs.map(d=>({...d.data(), id:d.id})); refresh(); }, ()=>{})];
  }
}
let rT; function refresh(){ clearTimeout(rT); rT = setTimeout(()=>{ const typing = S.drawer && $("#drawer").contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  const mainTyping = /^(q|eq|selfLink|claimSel)$/.test(document.activeElement?.id||"");
  if (!mainTyping) render(); else renderChrome();
  if (S.drawer && !typing && S.drawer.kind==="task") drawDrawer(); }, 60); }

try { const m = localStorage.getItem("bp-mode"); if (m==="board"||m==="table") S.jobsMode = m; } catch(_){}
window.addEventListener("hashchange", route);
route();
const live = (on,t) => { $("#live").classList.toggle("on",on); $("#liveText").textContent = t; };
(async () => {
  const claude = DEMO;
  if (!claude?.use) { S.offline = true; live(false,"Offline"); render(); return; }
  const [db, user, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  S.dl = dl; S.user = user;
  if (!db) { S.offline = true; live(false,"Not connected"); render(); return; }
  S.db = db;
  try { S.uid = await user?.id() ?? null; S.isAdmin = (await user?.canEdit()) ?? false; const w = await user?.can("data.write"); S.canWrite = w !== false; } catch(_){}
  const timer = setTimeout(()=>{ if (!S.loaded.jobs) live(false,"Still connecting"); }, 10000);
  for (const c of ["team","jobs","equipment","vendors"]) {
    db.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d=>({...d.data(), id:d.id}));
      if (!snap.metadata.fromCache || snap.size) { S.loaded[c] = true; }
      if (!snap.metadata.fromCache) { clearTimeout(timer); live(true,"Demo"); }
      if (c==="team") syncSubs();
      refresh();
    }, err => { S.loaded[c] = true; live(false, err?.code==="revoked"?"Access changed":"Disconnected"); refresh(); });
  }
  db.collection("work").onSnapshot(s => { S.claims = s.docs.map(d=>({...d.data(), id:d.id})); refresh(); }, ()=>{});
  render();
})();
})();
</script>
